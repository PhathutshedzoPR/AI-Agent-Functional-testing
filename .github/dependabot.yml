version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node version we run on (22 LTS), not the newest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # ESLint 10 waits until the Next, typescript-eslint and SonarJS plugins support it.
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
