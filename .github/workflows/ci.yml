name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: replay # build and unit tests need no API keys
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube Cloud needs full history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != '' # skipped until the repo owner adds the secret
        uses: SonarSource/sonarqube-scan-action@v8
      - run: npm audit --omit=dev --audit-level=high

  # The agent end to end in real Chromium: scorecard, accessibility, security over HTTP and the
  # exported Playwright tests. Replay mode, so it needs no API key.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_PROVIDER: replay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - name: Show the scorecard on the run page
        if: always()
        run: |
          if [ -f .data/scorecard.md ]; then
            { echo '## Agent scorecard'; echo; cat .data/scorecard.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # A failure on the runner can depend on its speed, so keep each run's events and screenshots.
      - name: Keep the runs when a check fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-runs
          path: |
            .data/integration
            .data/scorecard.md
          retention-days: 7
